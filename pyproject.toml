[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovox"
version = "0.1.0"
description = "Scaled reproduction of SKA-HNN and IAAMSoftmax for speaker verification on LibriSpeech"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neurovox Team"}
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "scikit-learn>=1.3.0",
    "speechbrain>=1.0.0",
    "torchinfo>=1.8.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
]
demo = [
    "gradio>=4.0.0",
    "umap-learn>=0.5.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
