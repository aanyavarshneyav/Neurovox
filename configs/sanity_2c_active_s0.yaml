# Phase 2C.1 Sanity Integration Diagnostic: S0 with Active AdaptiveDrop (Epoch 6)
project:
  name: "neurovox"
  description: "Phase 2C.1 Diagnostic: S0 Active AdaptiveDrop (Epoch 6)"

hardware:
  device: "mps"
  num_workers: 0
  pin_memory: false

audio:
  sampling_rate: 16000
  n_mels: 80
  win_length_ms: 25.0
  hop_length_ms: 10.0
  segment_frames: 180

augmentation:
  speed_perturbation:
    enabled: false
  rirs_noises:
    enabled: false
  synthetic_noise:
    enabled: false
  specaugment:
    enabled: false

model:
  name: "ska_hnn"
  switch: "S0"
  c_cnn: 32
  c_tdnn: 256
  emb_dim: 192
  attn_dim: 128
  ls_window: 21

loss:
  name: "iaam_softmax"
  num_classes: 251
  scale: 30.0
  margin: 0.2
  tau: 0.423
  tau_corr: 0.5
  esd: 5
  esc: 5
  min_keep_ratio: 0.5

training:
  batch_size: 64
  overfit_batch: true
  overfit_steps: 100
  overfit_epoch: 6
  lr_schedule: "constant"
  lr_max: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 3.0
  seed: 42

data:
  train_manifest: "data/manifests/train-clean-100.csv"

