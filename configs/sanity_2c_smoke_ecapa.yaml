# Phase 2C Sanity Integration Smoke Test: ECAPA-TDNN Baseline
project:
  name: "neurovox"
  description: "Phase 2C Smoke: ECAPA-TDNN Parameter-Matched"

hardware:
  device: "mps"
  num_workers: 0
  pin_memory: false

audio:
  sampling_rate: 16000
  n_mels: 80
  win_length_ms: 25.0
  hop_length_ms: 10.0
  segment_frames: 180

augmentation:
  speed_perturbation:
    enabled: false
  rirs_noises:
    enabled: false
  synthetic_noise:
    enabled: false
  specaugment:
    enabled: false

model:
  name: "ecapa_tdnn"
  variant: "param_matched"
  channels: 400
  emb_dim: 192

loss:
  name: "aam_softmax"
  num_classes: 251
  scale: 30.0
  margin: 0.2

training:
  batch_size: 64
  overfit_batch: true
  overfit_steps: 100
  lr_schedule: "constant"
  lr_max: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 3.0
  seed: 42

data:
  train_manifest: "data/manifests/train-clean-100.csv"
